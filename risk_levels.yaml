# 위험 등급 임계값 설정.
#
# DRAFT: 5주차 3단계에서 하기로 한 "임계값 스윕(분위수 스윕으로 precision/
# recall/F1 비교)"이 아직 실행되지 않았습니다. 그래서 여기 있는 0.3 / 0.5는
# 실데이터로 검증된 값이 아니라 원래 설계 당시 정한 값을 그대로 옮겨온
# 것입니다. 스윕 결과가 나오면 이 값을 바꾸고, compare_risk_thresholds.py로
# 변경 전/후 등급별 인시던트 건수를 비교해서 영향도를 확인한 뒤 반영하세요.
#
# reference(cvss/kisa_alert)는 "참고용 대응표"일 뿐입니다. 우리 Risk Score는
# 0~1 사이로 정규화한 룰 가중합(자체 산출 방식)이고, CVSS나 KISA 사이버위기
# 경보단계는 전혀 다른 기준/산출식으로 매겨지는 값입니다. 등급 이름을 빌려와
# 담당자가 감을 잡게 돕는 용도일 뿐, "Risk Score 87 = CVSS 8.7"처럼 수치를
# 등치시키면 안 됩니다. UI 툴팁에도 이 설명을 그대로 노출합니다.

levels:
  low:
    # score < max_score 이면 저위험
    max_score: 0.3
    label: 저위험
    reference:
      cvss: "Low (0.1-3.9)"
      kisa_alert: "정상·관심"
    meaning: "기록·모니터링"

  medium:
    # low.max_score <= score < max_score 이면 중위험
    max_score: 0.5
    label: 중위험
    reference:
      cvss: "Medium (4.0-6.9)"
      kisa_alert: "주의"
    meaning: "담당자 확인, 알림 발송"

  high:
    # medium.max_score(0.5) 이상은 전부 고위험 (상한 없음)
    max_score: null
    label: 고위험
    reference:
      cvss: "High·Critical (7.0-10.0)"
      kisa_alert: "경계·심각"
    meaning: "인시던트 승격, 즉시 대응·승인"
